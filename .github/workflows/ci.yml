name: CashCenter CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret & Sensitive File Scan
        run: |
          set -euo pipefail
          echo "==> Scanning repository for forbidden secrets or credential patterns..."
          FORBIDDEN_PATTERNS='(\.env$|\.env\.local$|\.env\.server$|\.key\.json$|id_rsa|\.pem$|\.pfx$)'
          VIOLATIONS=$(git ls-files | grep -Eq "$FORBIDDEN_PATTERNS" && git ls-files | grep -E "$FORBIDDEN_PATTERNS" || true)
          if [[ -n "$VIOLATIONS" ]]; then
            echo "❌ ERROR: Repository contains forbidden credentials/secret files:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No credential or secret files committed."

      - name: Check for Unresolved Merge Conflict Markers
        run: |
          set -euo pipefail
          if git grep -n "<<<<<<< " -- ':!*.md' ':!*.txt' ':!*.json' ':!.github/workflows/ci.yml' ':!scripts/pre-commit.sh'; then
            echo "❌ ERROR: Unresolved merge conflict markers detected in codebase."
            exit 1
          fi
          echo "✅ No merge conflict markers found."

  django-tests:
    name: Django Test Suite & System Checks
    runs-on: ubuntu-latest
    needs: security-audit

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cash_center_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax
        run: |
          python -m py_compile $(find django -name "*.py" -not -path "*/.venv/*")
          echo "✅ Python compilation check passed."

      - name: Django System Check
        working-directory: ./django
        env:
          SECRET_KEY: ci-github-actions-test-key-0123456789-abcdef
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DB_NAME: cash_center_test
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py check --fail-level ERROR

      - name: Collect Static Assets Check
        working-directory: ./django
        env:
          SECRET_KEY: ci-github-actions-test-key-0123456789-abcdef
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DB_NAME: cash_center_test
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py collectstatic --noinput

      - name: Run Test Suite
        working-directory: ./django
        env:
          SECRET_KEY: ci-github-actions-test-key-0123456789-abcdef
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DB_NAME: cash_center_test
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test --verbosity=2
