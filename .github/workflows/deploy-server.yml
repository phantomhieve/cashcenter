name: Deploy Server

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  pre-deploy-check:
    name: Pre-Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Secret Files
        run: |
          set -euo pipefail
          FORBIDDEN='(\.env$|\.env\.local$|\.env\.server$|\.key\.json$|id_rsa|\.pem$|\.pfx$)'
          if git ls-files | grep -Eq "$FORBIDDEN"; then
            echo "❌ ERROR: Cannot deploy with committed secrets!"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax Compilation Check
        run: |
          python -m py_compile $(find django -name "*.py" -not -path "*/.venv/*")
          echo "✅ Pre-deployment syntax verification passed."

  deploy:
    name: Deploy to Server
    needs: pre-deploy-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        env:
          SSH_KEY_FILE: ~/.ssh/deploy_key
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL }}
        run: |
          chmod +x scripts/deploy-server.sh
          ./scripts/deploy-server.sh
