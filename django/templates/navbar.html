{% load list_tags %}
<nav class="navbar navbar-expand-xl sticky-top">
    <a class="navbar-brand scroll navbar-heading" {% if request.user.is_staff %} href="{% url 'ledger_list' %}" {% else
        %} href="{% url 'ledger_base_list' %}" {% endif %}>
        <h1>{% get_shop %}</h1>
    </a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon">
            <i class="fa fa-navicon" style="color:#fff; font-size:28px;"></i>
        </span>
    </button>

    {% block search %}
    {% endblock search %}

    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="{% block nav_class %}navbar-nav ml-auto{% endblock %}">
            {% if request.user.is_staff %}
            <li class="nav-item navbar-item">
                <a href="{% url 'ledger_list' %}?{% url_replace %}" class="nav-link navbar-content">
                    <i class="fa fa-book" aria-hidden="true"></i> Ledger
                </a>
            </li>
            <li class="nav-item navbar-item">
                <a href="{% url 'ratelist_list' %}" class="nav-link navbar-content">
                    <i class="fa fa-list-alt" aria-hidden="true"></i> Rate List
                </a>
            </li>
            <li class="nav-item navbar-item">
                <a href="{% url 'order_list' %}" class="nav-link navbar-content">
                    <i class="fa fa-shopping-cart" aria-hidden="true"></i> Order List
                </a>
            </li>
            {% endif %}
            <!-- <li class="nav-item navbar-item">
                <h5><a href="{% url 'ledger_base_list' %}?{% url_replace %}" class="nav-link navbar-content">
                    {% if request.user.is_staff %}
                        Staff-l
                    {% else %}
                        Ledger
                    {% endif %}
                </a></h5>
            </li> -->
            {% block links %}
            {% endblock links %}
            <li class="nav-item navbar-item navbar-logout">
                <form method="post" action="{% url 'user_logout' %}" class="navbar-logout-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="fa fa-sign-out" aria-hidden="true"></i> Logout
                    </button>
                </form>
            </li>
        </ul>
    </div>
</nav>
