{% extends 'navbar.html' %}
{% load list_tags %}

{% block search %}
<div class="form-inline my-2 my-lg-0 ml-auto">
    <input class="form-control mr-sm-2 lrAutoComplete" type="search" placeholder="Search L R" aria-label="Search"
        autocomplete="off" data-url="{% url 'autocomplete' %}?field=l_r_no"
        data-redirect-url="{% url 'ledger_add' %}?l_r_view=" data-query-params="&{% url_replace %}">
</div>
{% endblock search %}

{% block nav_class %}navbar-nav{% endblock %}

{% block links %}
<li class="nav-item navbar-item">
    <a href="{% url 'ledger_add' %}?{% url_replace %}" class="nav-link navbar-content">
        <i class="fa fa-plus-circle" aria-hidden="true"></i> Add Ledger
    </a>
</li>
{% endblock links %}
